<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CA9A" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E8058" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F26" />
      <stop offset="100%" stop-color="#041814" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Outer Octagonal / Rounded Shield -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Border -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="3 2" />

  <!-- Artisanal Diamond Apex Star -->
  <path d="M50 16 L52.5 22 L58 24 L52.5 26 L50 32 L47.5 26 L42 24 L47.5 22 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />

  <!-- Interlocking Atelier Monogram: 'O' and 'A' -->
  <!-- Architectural 'A' Chevron Frame -->
  <path d="M28 78 L50 34 L72 78" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="36" y1="62" x2="64" y2="62" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Harmonious Intertwined Ellipse 'O' -->
  <ellipse cx="50" cy="56" rx="21" ry="17" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="88 20" stroke-dashoffset="15" />
  
  <!-- Center Artisan Diamond Core -->
  <polygon points="50,48 54,54 50,60 46,54" fill="url(#goldGrad)" />
</svg>
