server.port=${PORT:8080}

# Database Connection (CockroachDB / PostgreSQL or fallback SQLite)
# If DB_URL is set (e.g. postgresql://... or jdbc:postgresql://...), it will use PostgreSQL/CockroachDB driver.
# If DB_URL is unset, it defaults to local file: jdbc:sqlite:omnimarket_da3.db
spring.datasource.url=${DB_URL:jdbc:sqlite:omnimarket_da3.db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=OmniMarketHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=15000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.pages.dev,https://*.workers.dev,*}

# Admin Security Key for Professor Management Actions
app.admin.api-key=${ADMIN_API_KEY:omni-admin-secret-da3}

# Qdrant Vector Database Integration (Official REST API v1)
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection-name=${QDRANT_COLLECTION:omnimarket_products}
qdrant.dimensions=${QDRANT_DIMENSIONS:384}
qdrant.distance=${QDRANT_DISTANCE:Cosine}
qdrant.timeout-ms=${QDRANT_TIMEOUT_MS:5000}

# Embedding Model Configuration (local FastEmbed ONNX 384d / OpenAI 1536d)
embedding.provider=${EMBEDDING_PROVIDER:local}
embedding.openai.api-key=${OPENAI_API_KEY:}
embedding.openai.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
embedding.local.url=${LOCAL_EMBEDDING_URL:http://localhost:6333/embed}
