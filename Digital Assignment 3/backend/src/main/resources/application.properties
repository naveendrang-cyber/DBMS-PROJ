server.port=${PORT:8080}

# CockroachDB connection (PostgreSQL wire protocol via org.postgresql.Driver)
# Local single-node cluster started with "crdb-cli.cmd start" (insecure, user root).
# For CockroachDB Cloud, set DB_URL to the connection string from the Cloud console, e.g.
#   postgresql://<user>:<password>@<host>:26257/omnimarket?sslmode=verify-full
# Both postgresql://... and jdbc:postgresql://... forms are accepted.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:26257/omnimarket?sslmode=disable}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema/seed are applied by DatabaseConfig (and crdb-cli.cmd), not by Spring's SQL init
spring.sql.init.mode=never

# HikariCP connection pool
app.datasource.max-pool-size=${DB_POOL_SIZE:10}

# CORS: comma-separated origin patterns allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.workers.dev,https://*.pages.dev}

# Admin key required (X-Admin-Key header) for Professor INSERT / UPDATE / DELETE actions.
# Override in any shared deployment.
app.admin.api-key=${ADMIN_API_KEY:omni-admin-secret-da3}
