# Render Blueprint: OmniMarket DA3 Java backend (Spring Boot + JDBC on CockroachDB Cloud).
# Secrets (DB_URL, ADMIN_API_KEY) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: omnimarket-da3-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Digital Assignment 3/backend/Dockerfile
    dockerContext: ./Digital Assignment 3
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DB_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://omni-atelier-da3.harshzz.workers.dev,http://localhost:5173
